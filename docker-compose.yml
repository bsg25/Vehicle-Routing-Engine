name: georoute
services:

  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - georoute

  frontend:
    image: georoute-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - georoute

  backend:
    image: georoute-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx512m
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    mem_limit: 1g
    networks:
      - georoute

  postgres:
    image: pgrouting/pgrouting:latest
    container_name: georoute_postgres
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=20"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
    env_file:
      - backend/.env
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    mem_limit: 1g
    networks:
      - georoute

  osm-routing-import:
    image: iboates/osm2pgsql:latest
    volumes:
      - ./data/region.osm.pbf:/data/region.osm.pbf
    env_file:
      - ./backend/.env
    entrypoint: ["sh", "-c"]
    command: ['PGPASSWORD="$$POSTGRES_PASSWORD" osm2pgsql --slim --hstore -d "$$POSTGRES_DB" -H postgres -U "$$POSTGRES_USER" /data/region.osm.pbf']
    depends_on:
      - postgres
    profiles:
      - routing-import
    networks:
      - georoute

  redis:
    image: redis:alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - georoute


volumes:
  postgres-data:
  redis-data:
  osm-data:
  caddy-data:
  caddy-config:
networks:
  georoute:
